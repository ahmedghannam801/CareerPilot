# ─────────────────────────────────────────────────────────────────────────────
# CareerPilot AI — Render.com One-Click Backend Blueprint
# Steps: Render Dashboard → New → Blueprint → select this repo → Deploy
# Then add the env var values marked sync:false in the Render dashboard.
# ─────────────────────────────────────────────────────────────────────────────
services:
  - type: web
    name: careerpilot-api
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install --include=dev && npm run build
    startCommand: node --import tsx/esm server.ts
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      # ── Required: Google Gemini AI ───────────────────────────────────────────
      - key: GEMINI_API_KEY
        sync: false   # Paste from https://aistudio.google.com/app/apikey
      # ── Required: Supabase (PostgreSQL persistence) ──────────────────────────
      - key: SUPABASE_URL
        sync: false   # e.g. https://xxxx.supabase.co
      - key: SUPABASE_ANON_KEY
        sync: false   # Supabase anon/public key
      # ── Required: CORS — set to your Cloudflare Pages URL ───────────────────
      - key: CORS_ORIGIN
        sync: false   # e.g. https://careerpilot-dic.pages.dev
      - key: APP_URL
        sync: false   # same as CORS_ORIGIN
      # ── Optional: RapidAPI/JSearch for live job feeds ────────────────────────
      - key: RAPIDAPI_KEY
        sync: false   # From https://rapidapi.com → JSearch API → My Apps
      - key: JSEARCH_RAPIDAPI_KEY
        sync: false   # Same key as RAPIDAPI_KEY
      # ── Optional: LinkedIn OAuth (Sign In with LinkedIn) ─────────────────────
      - key: LINKEDIN_CLIENT_ID
        sync: false
      - key: LINKEDIN_CLIENT_SECRET
        sync: false
      - key: LINKEDIN_REDIRECT_URI
        sync: false   # https://<your-render-url>/api/auth/linkedin/callback
